[package]
name = "magpie-bot"
version = "0.1.0"
description = "喜鹊助手 - Tauri 桌面骨架（M0）"
authors = ["piwang99"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "magpie_bot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "magpie-bot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-global-shortcut = "2.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.54", features = ["sync", "time", "macros"] }
reqwest = { version = "0.13.5", features = ["stream", "json", "rustls"], default-features = false }
futures-util = "0.3"
keyring = "4.2.0"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta-typescript = "0.0.15"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }
